backend:
  name: git-gateway
  branch: main

# Where uploaded product images are saved
media_folder: "images/uploads"
public_folder: "/images/uploads"

# Friendlier editing: shows a preview-less, clean form
publish_mode: simple

collections:
  - name: "catalog"
    label: "Products"
    files:
      - name: "products"
        label: "Product List"
        file: "products.json"
        description: "Add, edit, remove and reorder your products here."
        fields:
          - name: "products"
            label: "Products"
            label_singular: "Product"
            widget: "list"
            summary: "{{fields.title}}  —  {{fields.price}}"
            fields:
              - { name: "id", label: "ID / slug (unique, lowercase, no spaces)", widget: "string", hint: "Used in the page link, e.g. nova-earbuds" }
              - { name: "title", label: "Product name", widget: "string" }
              - name: "category"
                label: "Category"
                widget: "select"
                options: ["Electronics", "Home", "Kitchen", "Beauty", "Fitness", "Accessories"]
                default: "Electronics"
              - { name: "image", label: "Product photo", widget: "image", required: false, hint: "Optional. Leave empty to show a coloured placeholder." }
              - { name: "accent", label: "Placeholder colour (hex)", widget: "string", required: false, default: "#3b5bdb", hint: "Used only if no photo is set, e.g. #3b5bdb" }
              - { name: "price", label: "Price", widget: "string", hint: "e.g. ₹1,799" }
              - { name: "was", label: "Original price (optional)", widget: "string", required: false, hint: "Shown struck-through, e.g. ₹3,999" }
              - { name: "rating", label: "Rating (0–5)", widget: "number", value_type: "float", min: 0, max: 5, step: 0.5, default: 4.5 }
              - { name: "deal", label: "Deal badge (optional)", widget: "string", required: false, hint: "e.g. 55% OFF, NEW, BESTSELLER" }
              - { name: "excerpt", label: "Short summary (card text)", widget: "text" }
              - { name: "affiliate", label: "Affiliate link", widget: "string", hint: "Your full affiliate URL — used by the buttons in the review" }
              - { name: "lead", label: "Review intro", widget: "text" }
              - { name: "pros", label: "Pros", widget: "list", field: { name: "item", label: "Pro", widget: "string" } }
              - { name: "cons", label: "Cons", widget: "list", field: { name: "item", label: "Con", widget: "string" } }
              - { name: "verdict", label: "Final verdict", widget: "text" }
